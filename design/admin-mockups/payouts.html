<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Green Basket – Payouts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --green-700:#2D6A4F;--green-800:#1B4332;--green-50:#EAF4EC;
      --white:#FFFFFF;--gray-50:#F4F5F4;--gray-100:#EDEEED;--gray-200:#D9DBD9;
      --gray-400:#9CA09C;--gray-500:#787C78;--gray-900:#1A1A1A;
      --orange-500:#E08A3C;--orange-50:#FFF5EB;
      --amber-700:#92700C;--amber-50:#FFF9E6;
      --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased}
    body{background:#DDDEDD;display:flex;justify-content:center;align-items:flex-start}

    .phone{width:100%;max-width:393px;min-height:100vh;background:var(--gray-50);position:relative;display:flex;flex-direction:column;overflow:hidden}
    .scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:84px}
    .scroll-area::-webkit-scrollbar{display:none}.scroll-area{scrollbar-width:none}

    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 0;height:46px;flex-shrink:0;background:var(--green-800);z-index:10}
    .status-time{font-size:15px;font-weight:600;letter-spacing:.3px;color:var(--white)}
    .status-right{display:flex;align-items:center;gap:5px}
    .status-right i{font-size:12px;color:var(--white)}

    .header-green{background:var(--green-800);padding:14px 20px 28px;border-radius:0 0 24px 24px}
    .header-row{display:flex;align-items:center;justify-content:space-between}
    .header-title{font-size:22px;font-weight:700;color:var(--white);letter-spacing:-.3px}
    .header-crumb{font-size:13px;font-weight:400;color:rgba(255,255,255,.5);margin-top:4px}
    .avatar-circle{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--white);flex-shrink:0;border:2px solid rgba(255,255,255,.25);cursor:pointer}

    /* Pending Total Banner */
    .pending-banner{
      margin:20px 20px 0;background:var(--amber-50);border-radius:14px;
      padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
    }
    .pending-banner-left{}
    .pending-label{font-size:12px;font-weight:500;color:var(--amber-700);margin-bottom:4px}
    .pending-amount{font-size:26px;font-weight:800;color:var(--gray-900)}
    .process-all-btn{
      padding:11px 20px;border-radius:10px;border:none;
      background:var(--green-800);color:var(--white);
      font-size:13.5px;font-weight:600;font-family:var(--font);
      cursor:pointer;transition:transform .12s;-webkit-tap-highlight-color:transparent;
    }
    .process-all-btn:active{transform:scale(.94)}

    /* Filter Pills */
    .filters{display:flex;gap:8px;padding:18px 20px 16px}
    .pill{
      padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;
      font-family:var(--font);border:1.5px solid var(--gray-200);
      background:var(--white);color:var(--gray-500);cursor:pointer;
      transition:all .2s;-webkit-tap-highlight-color:transparent;
    }
    .pill:active{transform:scale(.95)}
    .pill.on{background:var(--green-800);color:var(--white);border-color:var(--green-800)}

    /* Payout Cards */
    .payout-list{display:flex;flex-direction:column;gap:10px;padding:0 20px}

    .payout-card{
      background:var(--white);border-radius:14px;padding:16px 16px 14px;
      transition:transform .12s;
    }

    .payout-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
    .payout-name{font-size:15px;font-weight:600;color:var(--gray-900)}
    .payout-amount{font-size:17px;font-weight:700;color:var(--gray-900)}
    .payout-period{font-size:12.5px;font-weight:400;color:var(--gray-400);margin-bottom:10px}

    .payout-bottom{display:flex;align-items:center;justify-content:space-between}

    .payout-badge{
      font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;
    }
    .payout-badge.pending{background:var(--orange-50);color:var(--orange-500)}
    .payout-badge.processing{background:var(--green-50);color:var(--green-700)}
    .payout-badge.completed{background:var(--gray-100);color:var(--gray-500)}

    .process-btn{
      padding:10px 20px;border-radius:10px;border:none;
      background:var(--green-800);color:var(--white);
      font-size:13px;font-weight:600;font-family:var(--font);
      cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      transition:transform .12s;-webkit-tap-highlight-color:transparent;
    }
    .process-btn:active{transform:scale(.94)}
    .process-btn i{font-size:11px}

    /* Bottom Nav */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:393px;background:var(--white);display:flex;justify-content:space-around;align-items:center;padding:6px 0 20px;z-index:100;border-top:1px solid var(--gray-100)}
    .tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 10px 0;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
    .tab i{font-size:19px;color:var(--gray-400);transition:color .2s}
    .tab span{font-size:10px;font-weight:600;color:var(--gray-400);transition:color .2s}
    .tab.on .tab-pill{width:48px;height:32px;border-radius:16px;background:var(--green-800);display:flex;align-items:center;justify-content:center}
    .tab.on .tab-pill i{font-size:16px;color:var(--white)}
    .tab.on span{color:var(--gray-900);font-weight:700}
    .tab:not(.on) .tab-pill{display:flex;align-items:center;justify-content:center;height:32px}

    .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--green-800);color:var(--white);font-size:13px;font-weight:600;font-family:var(--font);padding:12px 24px;border-radius:28px;box-shadow:0 8px 28px rgba(27,67,50,.32);z-index:300;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
    .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim{animation:fadeUp .4s ease both}
    .d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}
    .d4{animation-delay:.16s}.d5{animation-delay:.22s}.d6{animation-delay:.28s}
    .d7{animation-delay:.34s}.d8{animation-delay:.40s}

    @media(min-width:500px){body{align-items:center;min-height:100vh;padding:24px}.phone{min-height:852px;max-height:92vh;border-radius:44px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 28px 80px rgba(0,0,0,.12)}.scroll-area{border-radius:0 0 44px 44px}.bottom-nav{border-radius:0 0 44px 44px}}
    @media(max-width:393px){.phone{max-width:100%}.bottom-nav{max-width:100%}}
  </style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-right">
      <i class="fa-solid fa-play" style="font-size:10px"></i>
      <i class="fa-solid fa-circle" style="font-size:10px"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="scroll-area">

    <div class="header-green anim d1">
      <div class="header-row">
        <div>
          <h1 class="header-title">Payouts</h1>
          <p class="header-crumb">Admin › Finance › Payouts</p>
        </div>
        <div class="avatar-circle" id="btnAvatar">SA</div>
      </div>
    </div>

    <!-- Pending Total -->
    <div class="pending-banner anim d2">
      <div class="pending-banner-left">
        <p class="pending-label">Pending Total</p>
        <p class="pending-amount">₹2,84,500</p>
      </div>
      <button class="process-all-btn" id="processAllBtn">Process All</button>
    </div>

    <!-- Filters -->
    <div class="filters anim d3">
      <button class="pill on" data-filter="all">Pending</button>
      <button class="pill" data-filter="processing">Processing</button>
      <button class="pill" data-filter="completed">Completed</button>
    </div>

    <!-- Payout List -->
    <div class="payout-list">

      <div class="payout-card anim d4" data-status="pending">
        <div class="payout-top">
          <span class="payout-name">FreshFarms</span>
          <span class="payout-amount">₹28,400</span>
        </div>
        <p class="payout-period">Period: Mar 1–15, 2026</p>
        <div class="payout-bottom">
          <span class="payout-badge pending">Pending</span>
          <button class="process-btn" data-merchant="FreshFarms">Process <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>

      <div class="payout-card anim d5" data-status="pending">
        <div class="payout-top">
          <span class="payout-name">OrganicOasis</span>
          <span class="payout-amount">₹41,200</span>
        </div>
        <p class="payout-period">Period: Mar 1–15, 2026</p>
        <div class="payout-bottom">
          <span class="payout-badge pending">Pending</span>
          <button class="process-btn" data-merchant="OrganicOasis">Process <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>

      <div class="payout-card anim d6" data-status="processing">
        <div class="payout-top">
          <span class="payout-name">GreenLeaf</span>
          <span class="payout-amount">₹18,900</span>
        </div>
        <p class="payout-period">Period: Feb 16–28, 2026</p>
        <div class="payout-bottom">
          <span class="payout-badge processing">Processing</span>
        </div>
      </div>

      <div class="payout-card anim d7" data-status="pending">
        <div class="payout-top">
          <span class="payout-name">NatureBox</span>
          <span class="payout-amount">₹63,500</span>
        </div>
        <p class="payout-period">Period: Feb 16–28, 2026</p>
        <div class="payout-bottom">
          <span class="payout-badge pending">Pending</span>
          <button class="process-btn" data-merchant="NatureBox">Process <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>

    </div>

  </div>

  <nav class="bottom-nav">
    <button class="tab" data-t="dashboard"><div class="tab-pill"><i class="fa-solid fa-house"></i></div><span>Dashboard</span></button>
    <button class="tab" data-t="users"><div class="tab-pill"><i class="fa-solid fa-user"></i></div><span>Users</span></button>
    <button class="tab" data-t="orders"><div class="tab-pill"><i class="fa-solid fa-receipt"></i></div><span>Orders</span></button>
    <button class="tab on" data-t="finance"><div class="tab-pill"><i class="fa-solid fa-sack-dollar"></i></div><span>Finance</span></button>
    <button class="tab" data-t="more"><div class="tab-pill"><i class="fa-solid fa-grip"></i></div><span>More</span></button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(()=>{
  'use strict';
  const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
  const toast=q('#toast');let tt=null;
  function flash(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),2200)}

  q('#processAllBtn').addEventListener('click',()=>flash('Processing all payouts…'));

  qa('.process-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const card=btn.closest('.payout-card');
      flash('Processing '+btn.dataset.merchant+'…');
      card.querySelector('.payout-badge').className='payout-badge processing';
      card.querySelector('.payout-badge').textContent='Processing';
      btn.remove();
    });
  });

  qa('.tab').forEach(t=>{t.addEventListener('click',()=>{
    const tab=t.dataset.t;
    if(tab==='dashboard')window.location.href='admin.html';
    else if(tab==='users')window.location.href='users.html';
    else if(tab==='orders')window.location.href='orders.html';
    else{qa('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');flash(tab.charAt(0).toUpperCase()+tab.slice(1))}
  })});

  q('#btnAvatar').addEventListener('click',()=>flash('Super Admin'));
})();
</script>
</body>
</html>
