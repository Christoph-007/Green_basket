<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Green Basket – Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       RESET & VARIABLES
       ============================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green-700: #2D6A4F;
      --green-800: #1B4332;
      --green-900: #14352A;
      --green-50: #EAF4EC;
      --green-action: #3A7D5C;
      --white: #FFFFFF;
      --gray-50: #F4F5F4;
      --gray-100: #EDEEED;
      --gray-200: #D9DBD9;
      --gray-400: #9CA09C;
      --gray-500: #787C78;
      --gray-700: #3D3D3D;
      --gray-900: #1A1A1A;
      --orange-600: #D4820A;
      --orange-50: #FDF5E6;
      --orange-action: #E8981D;
      --yellow-50: #FFF9E6;
      --yellow-500: #D4A20A;
      --red-500: #D64545;
      --blue-500: #2E86C1;
      --blue-50: #EBF5FB;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #DDDEDD;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ============================================
       PHONE SHELL
       ============================================ */
    .phone {
      width: 100%;
      max-width: 393px;
      min-height: 100vh;
      background: var(--gray-50);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 84px;
    }

    .scroll-area::-webkit-scrollbar { display: none; }
    .scroll-area { scrollbar-width: none; }

    /* ============================================
       STATUS BAR
       ============================================ */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 26px 0;
      height: 46px;
      flex-shrink: 0;
      background: var(--green-800);
      position: relative;
      z-index: 10;
    }

    .status-time {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--white);
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-right i {
      font-size: 12px;
      color: var(--white);
    }

    /* ============================================
       GREEN HEADER
       ============================================ */
    .header-green {
      background: var(--green-800);
      padding: 14px 20px 28px;
      border-radius: 0 0 24px 24px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .greeting {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      margin-bottom: 4px;
    }

    .greeting-emoji {
      font-style: normal;
    }

    .header-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.3px;
    }

    .avatar-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.15s;
      border: 2px solid rgba(255,255,255,0.25);
    }

    .avatar-circle:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ============================================
       CONTENT AREA
       ============================================ */
    .content {
      padding: 0 20px;
    }

    /* ============================================
       SECTION TITLES
       ============================================ */
    .sec-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.2px;
      padding: 22px 0 14px;
    }

    /* ============================================
       OVERVIEW STAT CARDS — 2×2 Grid
       ============================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--white);
      border-radius: 14px;
      padding: 18px 16px;
      border: 1.5px solid var(--gray-100);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .stat-card:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .stat-card:active {
      transform: scale(0.97);
    }

    .stat-val {
      font-size: 28px;
      font-weight: 800;
      color: var(--gray-900);
      letter-spacing: -0.8px;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-400);
    }

    /* ============================================
       PENDING ACTION CARDS
       ============================================ */
    .pending-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pending-card {
      border-radius: 14px;
      padding: 18px 16px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .pending-card:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .pending-card:active {
      transform: scale(0.97);
    }

    .pending-card.orange {
      background: var(--orange-50);
    }

    .pending-card.yellow {
      background: var(--yellow-50);
    }

    .pending-val {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .pending-card.orange .pending-val {
      color: var(--orange-600);
    }

    .pending-card.yellow .pending-val {
      color: var(--yellow-500);
    }

    .pending-label {
      font-size: 13px;
      font-weight: 500;
    }

    .pending-card.orange .pending-label {
      color: #9E6B10;
    }

    .pending-card.yellow .pending-label {
      color: #8B7A20;
    }

    /* ============================================
       RECENT ORDERS
       ============================================ */
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 8px;
    }

    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border-radius: 14px;
      padding: 16px 16px;
      border: 1.5px solid var(--gray-100);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .order-item:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .order-item:active {
      transform: scale(0.985);
    }

    .order-id {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-900);
    }

    .order-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .order-badge.delivered {
      background: var(--green-50);
      color: var(--green-700);
    }

    .order-badge.preparing {
      background: var(--orange-50);
      color: var(--orange-600);
    }

    .order-badge.out {
      background: var(--blue-50);
      color: var(--blue-500);
    }

    /* ============================================
       BOTTOM NAV
       ============================================ */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 393px;
      background: var(--white);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 0 20px;
      z-index: 100;
      border-top: 1px solid var(--gray-100);
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 10px 0;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font);
    }

    .tab i {
      font-size: 19px;
      color: var(--gray-400);
      transition: color 0.2s;
    }

    .tab span {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-400);
      transition: color 0.2s;
    }

    /* Active tab with green circle behind icon */
    .tab.on {
      position: relative;
    }

    .tab.on .tab-pill {
      width: 48px;
      height: 32px;
      border-radius: 16px;
      background: var(--green-800);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab.on .tab-pill i {
      font-size: 16px;
      color: var(--white);
    }

    .tab.on span {
      color: var(--gray-900);
      font-weight: 700;
    }

    /* Regular (not active) icon wrapper */
    .tab:not(.on) .tab-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
    }

    /* ============================================
       TOAST
       ============================================ */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: var(--green-800);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      padding: 12px 24px;
      border-radius: 28px;
      box-shadow: 0 8px 28px rgba(27,67,50,0.32);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================
       ANIMATIONS
       ============================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim { animation: fadeUp 0.4s ease both; }
    .d1 { animation-delay: 0.04s; }
    .d2 { animation-delay: 0.08s; }
    .d3 { animation-delay: 0.12s; }
    .d4 { animation-delay: 0.16s; }
    .d5 { animation-delay: 0.20s; }
    .d6 { animation-delay: 0.24s; }
    .d7 { animation-delay: 0.28s; }
    .d8 { animation-delay: 0.32s; }
    .d9 { animation-delay: 0.36s; }
    .d10 { animation-delay: 0.40s; }
    .d11 { animation-delay: 0.44s; }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (min-width: 500px) {
      body {
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .phone {
        min-height: 852px;
        max-height: 92vh;
        border-radius: 44px;
        box-shadow:
          0 0 0 1px rgba(0,0,0,0.05),
          0 28px 80px rgba(0,0,0,0.12);
      }
      .scroll-area { border-radius: 0 0 44px 44px; }
      .bottom-nav  { border-radius: 0 0 44px 44px; }
    }

    @media (max-width: 393px) {
      .phone      { max-width: 100%; }
      .bottom-nav { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-right">
      <i class="fa-solid fa-play" style="font-size:10px;"></i>
      <i class="fa-solid fa-circle" style="font-size:10px;"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="scroll-area">

    <!-- Green Header -->
    <div class="header-green anim d1">
      <div class="header-row">
        <div>
          <p class="greeting">Good morning <span class="greeting-emoji">👋</span></p>
          <h1 class="header-title">Admin Dashboard</h1>
        </div>
        <div class="avatar-circle" id="btnAvatar">SA</div>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Overview -->
      <h2 class="sec-title anim d2">Overview</h2>

      <div class="stats-grid">
        <div class="stat-card anim d3" data-label="Total Users">
          <p class="stat-val">24,818</p>
          <p class="stat-label">Total Users</p>
        </div>
        <div class="stat-card anim d4" data-label="Orders Today">
          <p class="stat-val">1,284</p>
          <p class="stat-label">Orders Today</p>
        </div>
        <div class="stat-card anim d5" data-label="Revenue">
          <p class="stat-val">₹14.8L</p>
          <p class="stat-label">Revenue</p>
        </div>
        <div class="stat-card anim d6" data-label="Pending Actions">
          <p class="stat-val" style="color: var(--orange-600);">7</p>
          <p class="stat-label">Pending Actions</p>
        </div>
      </div>

      <!-- Pending Actions -->
      <h2 class="sec-title anim d7">Pending Actions</h2>

      <div class="pending-grid">
        <div class="pending-card orange anim d8" data-label="Merchant Approvals">
          <p class="pending-val">3</p>
          <p class="pending-label">Merchant Approvals</p>
        </div>
        <div class="pending-card yellow anim d9" data-label="Agent Verifications">
          <p class="pending-val">2</p>
          <p class="pending-label">Agent Verifications</p>
        </div>
      </div>

      <!-- Recent Orders -->
      <h2 class="sec-title anim d10">Recent Orders</h2>

      <div class="orders-list">
        <div class="order-item anim d10" data-order="GB-4820">
          <span class="order-id">GB-4820</span>
          <span class="order-badge delivered">Delivered</span>
        </div>
        <div class="order-item anim d11" data-order="GB-4819">
          <span class="order-id">GB-4819</span>
          <span class="order-badge preparing">Preparing</span>
        </div>
        <div class="order-item anim d11" data-order="GB-4818">
          <span class="order-id">GB-4818</span>
          <span class="order-badge out">Out for Delivery</span>
        </div>
      </div>

    </div><!-- /content -->

  </div><!-- /scroll-area -->

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="nav">
    <button class="tab on" data-t="dashboard">
      <div class="tab-pill">
        <i class="fa-solid fa-house"></i>
      </div>
      <span>Dashboard</span>
    </button>
    <button class="tab" data-t="users">
      <div class="tab-pill">
        <i class="fa-solid fa-user"></i>
      </div>
      <span>Users</span>
    </button>
    <button class="tab" data-t="orders">
      <div class="tab-pill">
        <i class="fa-solid fa-receipt"></i>
      </div>
      <span>Orders</span>
    </button>
    <button class="tab" data-t="finance">
      <div class="tab-pill">
        <i class="fa-solid fa-sack-dollar"></i>
      </div>
      <span>Finance</span>
    </button>
    <button class="tab" data-t="more">
      <div class="tab-pill">
        <i class="fa-solid fa-grip"></i>
      </div>
      <span>More</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>


<script>
(() => {
  'use strict';

  const q  = s => document.querySelector(s);
  const qa = s => document.querySelectorAll(s);
  const toast = q('#toast');
  let tt = null;

  function flash(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(() => toast.classList.remove('on'), 2200);
  }

  /* Avatar */
  q('#btnAvatar').addEventListener('click', () => {
    flash('Super Admin profile');
  });

  /* Stat cards */
  qa('.stat-card').forEach(c => {
    c.addEventListener('click', () => {
      const label = c.dataset.label;
      const val = c.querySelector('.stat-val').textContent;
      flash(`${label}: ${val}`);
    });
  });

  /* Pending action cards */
  qa('.pending-card').forEach(c => {
    c.addEventListener('click', () => {
      const label = c.dataset.label;
      const val = c.querySelector('.pending-val').textContent;
      flash(`${val} ${label}`);
    });
  });

  /* Order items */
  qa('.order-item').forEach(item => {
    item.addEventListener('click', () => {
      const id = item.dataset.order;
      const status = item.querySelector('.order-badge').textContent;
      flash(`Order ${id} — ${status}`);
    });
  });

  /* Bottom nav */
  qa('.tab').forEach(t => {
    t.addEventListener('click', () => {
      qa('.tab').forEach(x => x.classList.remove('on'));
      t.classList.add('on');
      const name = t.dataset.t;
      flash(name.charAt(0).toUpperCase() + name.slice(1));
    });
  });

})();
</script>

</body>
</html>
