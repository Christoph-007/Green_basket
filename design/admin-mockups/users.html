<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Green Basket – All Users</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       RESET & VARIABLES
       ============================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green-700: #2D6A4F;
      --green-800: #1B4332;
      --green-50: #EAF4EC;
      --white: #FFFFFF;
      --gray-50: #F4F5F4;
      --gray-100: #EDEEED;
      --gray-200: #D9DBD9;
      --gray-400: #9CA09C;
      --gray-500: #787C78;
      --gray-900: #1A1A1A;
      --red-500: #D64545;
      --red-50: #FDECEC;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #DDDEDD;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ============================================
       PHONE SHELL
       ============================================ */
    .phone {
      width: 100%;
      max-width: 393px;
      min-height: 100vh;
      background: var(--gray-50);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 84px;
    }

    .scroll-area::-webkit-scrollbar { display: none; }
    .scroll-area { scrollbar-width: none; }

    /* ============================================
       STATUS BAR
       ============================================ */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 26px 0;
      height: 46px;
      flex-shrink: 0;
      background: var(--green-800);
      z-index: 10;
    }

    .status-time {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--white);
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-right i {
      font-size: 12px;
      color: var(--white);
    }

    /* ============================================
       GREEN HEADER
       ============================================ */
    .header-green {
      background: var(--green-800);
      padding: 14px 20px 28px;
      border-radius: 0 0 24px 24px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.3px;
    }

    .header-crumb {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .avatar-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.25);
      cursor: pointer;
    }

    /* ============================================
       SEARCH BAR
       ============================================ */
    .search-wrap {
      padding: 20px 20px 14px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      border: 1.5px solid var(--gray-100);
      border-radius: 12px;
      padding: 13px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--green-700);
      box-shadow: 0 0 0 3px rgba(45,106,79,0.08);
    }

    .search-box i {
      font-size: 15px;
      color: var(--gray-400);
      flex-shrink: 0;
    }

    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: var(--font);
      color: var(--gray-900);
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--gray-400);
    }

    /* ============================================
       FILTER PILLS
       ============================================ */
    .filters {
      display: flex;
      gap: 8px;
      padding: 0 20px 18px;
    }

    .pill {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      border: 1.5px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-500);
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .pill:active { transform: scale(0.95); }

    .pill.on {
      background: var(--green-800);
      color: var(--white);
      border-color: var(--green-800);
    }

    /* ============================================
       USER LIST
       ============================================ */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 20px;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--white);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }

    .user-row:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .user-row:active {
      transform: scale(0.985);
    }

    /* User avatar initials */
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-avatar.olive {
      background: #E8EFD5;
      color: #5F7030;
    }

    .user-avatar.sage {
      background: #DDE8D5;
      color: #4A6B30;
    }

    .user-avatar.rose {
      background: #F5DDD5;
      color: #9B4830;
    }

    .user-avatar.teal {
      background: #D5E8E2;
      color: #307050;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 3px;
    }

    .user-meta {
      font-size: 12px;
      font-weight: 400;
      color: var(--gray-400);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-status {
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-status.active {
      color: var(--green-700);
    }

    .user-status.blocked {
      color: var(--red-500);
    }

    /* ============================================
       BOTTOM NAV
       ============================================ */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 393px;
      background: var(--white);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 0 20px;
      z-index: 100;
      border-top: 1px solid var(--gray-100);
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 10px 0;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font);
    }

    .tab i {
      font-size: 19px;
      color: var(--gray-400);
      transition: color 0.2s;
    }

    .tab span {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-400);
      transition: color 0.2s;
    }

    .tab.on .tab-pill {
      width: 48px;
      height: 32px;
      border-radius: 16px;
      background: var(--green-800);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab.on .tab-pill i {
      font-size: 16px;
      color: var(--white);
    }

    .tab.on span {
      color: var(--gray-900);
      font-weight: 700;
    }

    .tab:not(.on) .tab-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
    }

    /* ============================================
       TOAST
       ============================================ */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: var(--green-800);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      padding: 12px 24px;
      border-radius: 28px;
      box-shadow: 0 8px 28px rgba(27,67,50,0.32);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================
       ANIMATIONS
       ============================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim { animation: fadeUp 0.4s ease both; }
    .d1 { animation-delay: 0.04s; }
    .d2 { animation-delay: 0.08s; }
    .d3 { animation-delay: 0.12s; }
    .d4 { animation-delay: 0.16s; }
    .d5 { animation-delay: 0.20s; }
    .d6 { animation-delay: 0.24s; }
    .d7 { animation-delay: 0.28s; }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (min-width: 500px) {
      body { align-items: center; min-height: 100vh; padding: 24px; }
      .phone {
        min-height: 852px; max-height: 92vh; border-radius: 44px;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 28px 80px rgba(0,0,0,0.12);
      }
      .scroll-area { border-radius: 0 0 44px 44px; }
      .bottom-nav  { border-radius: 0 0 44px 44px; }
    }
    @media (max-width: 393px) {
      .phone { max-width: 100%; }
      .bottom-nav { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-right">
      <i class="fa-solid fa-play" style="font-size:10px;"></i>
      <i class="fa-solid fa-circle" style="font-size:10px;"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="scroll-area">

    <!-- Green Header -->
    <div class="header-green anim d1">
      <div class="header-row">
        <div>
          <h1 class="header-title">All Users</h1>
          <p class="header-crumb">Admin › Users</p>
        </div>
        <div class="avatar-circle" id="btnAvatar">SA</div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrap anim d2">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search users..." id="searchInput" autocomplete="off">
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="filters anim d3" id="filters">
      <button class="pill on" data-filter="all">All</button>
      <button class="pill" data-filter="active">Active</button>
      <button class="pill" data-filter="blocked">Blocked</button>
    </div>

    <!-- User List -->
    <div class="user-list" id="userList">

      <a class="user-row anim d4" href="user-detail.html?user=ak" data-status="active">
        <div class="user-avatar olive">AK</div>
        <div class="user-info">
          <p class="user-name">Arjun Kumar</p>
          <p class="user-meta">arjun@email.com · +91 98765 43210</p>
        </div>
        <span class="user-status active">Active</span>
      </a>

      <a class="user-row anim d5" href="user-detail.html?user=sm" data-status="active">
        <div class="user-avatar sage">SM</div>
        <div class="user-info">
          <p class="user-name">Sneha Mehta</p>
          <p class="user-meta">sneha@email.com · +91 87654 32109</p>
        </div>
        <span class="user-status active">Active</span>
      </a>

      <a class="user-row anim d6" href="user-detail.html?user=rv" data-status="blocked">
        <div class="user-avatar rose">RV</div>
        <div class="user-info">
          <p class="user-name">Rahul Verma</p>
          <p class="user-meta">rahul@email.com · Blocked</p>
        </div>
        <span class="user-status blocked">Blocked</span>
      </a>

      <a class="user-row anim d7" href="user-detail.html?user=pg" data-status="active">
        <div class="user-avatar teal">PG</div>
        <div class="user-info">
          <p class="user-name">Priya Gupta</p>
          <p class="user-meta">priya@email.com · +91 76543 21098</p>
        </div>
        <span class="user-status active">Active</span>
      </a>

    </div>

  </div><!-- /scroll-area -->

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="nav">
    <button class="tab" data-t="dashboard">
      <div class="tab-pill"><i class="fa-solid fa-house"></i></div>
      <span>Dashboard</span>
    </button>
    <button class="tab on" data-t="users">
      <div class="tab-pill"><i class="fa-solid fa-user"></i></div>
      <span>Users</span>
    </button>
    <button class="tab" data-t="orders">
      <div class="tab-pill"><i class="fa-solid fa-receipt"></i></div>
      <span>Orders</span>
    </button>
    <button class="tab" data-t="finance">
      <div class="tab-pill"><i class="fa-solid fa-sack-dollar"></i></div>
      <span>Finance</span>
    </button>
    <button class="tab" data-t="more">
      <div class="tab-pill"><i class="fa-solid fa-grip"></i></div>
      <span>More</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  'use strict';

  const q  = s => document.querySelector(s);
  const qa = s => document.querySelectorAll(s);
  const toast = q('#toast');
  let tt = null;

  function flash(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(() => toast.classList.remove('on'), 2200);
  }

  /* Filter pills */
  const pills = qa('.pill');
  const rows  = qa('.user-row');

  pills.forEach(p => {
    p.addEventListener('click', () => {
      pills.forEach(x => x.classList.remove('on'));
      p.classList.add('on');

      const filter = p.dataset.filter;
      rows.forEach(row => {
        const st = row.dataset.status;
        if (filter === 'all' || st === filter) {
          row.style.display = 'flex';
        } else {
          row.style.display = 'none';
        }
      });
    });
  });

  /* Search */
  q('#searchInput').addEventListener('input', e => {
    const val = e.target.value.toLowerCase().trim();
    rows.forEach(row => {
      const name = row.querySelector('.user-name').textContent.toLowerCase();
      const meta = row.querySelector('.user-meta').textContent.toLowerCase();
      row.style.display = (name.includes(val) || meta.includes(val)) ? 'flex' : 'none';
    });
  });

  /* Bottom nav */
  qa('.tab').forEach(t => {
    t.addEventListener('click', () => {
      const tab = t.dataset.t;
      if (tab === 'dashboard') {
        window.location.href = 'admin.html';
      } else {
        qa('.tab').forEach(x => x.classList.remove('on'));
        t.classList.add('on');
        flash(tab.charAt(0).toUpperCase() + tab.slice(1));
      }
    });
  });

  /* Avatar */
  q('#btnAvatar').addEventListener('click', () => flash('Super Admin'));

})();
</script>

</body>
</html>
