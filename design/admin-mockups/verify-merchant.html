<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Green Basket – Verify Merchant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --green-700:#2D6A4F;--green-800:#1B4332;--green-50:#EAF4EC;
      --white:#FFFFFF;--gray-50:#F4F5F4;--gray-100:#EDEEED;--gray-200:#D9DBD9;
      --gray-400:#9CA09C;--gray-500:#787C78;--gray-900:#1A1A1A;
      --red-500:#D64545;--red-50:#FDECEC;--orange-500:#E08A3C;--orange-50:#FFF5EB;
      --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased}
    body{background:#DDDEDD;display:flex;justify-content:center;align-items:flex-start}

    /* Phone */
    .phone{width:100%;max-width:393px;min-height:100vh;background:var(--gray-50);position:relative;display:flex;flex-direction:column;overflow:hidden}
    .scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:84px}
    .scroll-area::-webkit-scrollbar{display:none}.scroll-area{scrollbar-width:none}

    /* Status Bar */
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 0;height:46px;flex-shrink:0;background:var(--green-800);z-index:10}
    .status-time{font-size:15px;font-weight:600;letter-spacing:.3px;color:var(--white)}
    .status-right{display:flex;align-items:center;gap:5px}
    .status-right i{font-size:12px;color:var(--white)}

    /* Header */
    .header-green{background:var(--green-800);padding:14px 20px 28px;border-radius:0 0 24px 24px}
    .header-row{display:flex;align-items:center;justify-content:space-between}
    .header-title{font-size:22px;font-weight:700;color:var(--white);letter-spacing:-.3px}
    .header-crumb{font-size:13px;font-weight:400;color:rgba(255,255,255,.5);margin-top:4px}
    .avatar-circle{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--white);flex-shrink:0;border:2px solid rgba(255,255,255,.25);cursor:pointer}

    /* Merchant Info Card */
    .merchant-card{
      margin:20px 20px 0;background:var(--white);border-radius:16px;padding:18px 18px 16px;
    }
    .merchant-top{display:flex;align-items:center;gap:14px;margin-bottom:8px}
    .merchant-avatar{
      width:52px;height:52px;border-radius:50%;
      background:#E8EFD5;color:#2D6A4F;
      display:flex;align-items:center;justify-content:center;
      font-size:18px;font-weight:700;flex-shrink:0;
    }
    .merchant-details{flex:1;min-width:0}
    .merchant-name{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:2px}
    .merchant-cat{font-size:13px;font-weight:400;color:var(--gray-400)}
    .merchant-loc{font-size:12.5px;font-weight:400;color:var(--gray-400);display:flex;align-items:center;gap:4px;margin-top:2px}
    .merchant-loc i{font-size:11px;color:var(--orange-500)}
    .merchant-date{font-size:12px;font-weight:400;color:var(--gray-400);margin-top:6px}

    /* Section Title */
    .section-title{
      font-size:15px;font-weight:700;color:var(--gray-900);
      padding:22px 20px 12px;
    }

    /* Document Checklist */
    .doc-list{
      margin:0 20px;background:var(--white);border-radius:14px;overflow:hidden;
    }
    .doc-row{
      display:flex;align-items:center;padding:16px 18px;
      border-bottom:1px solid var(--gray-100);
    }
    .doc-row:last-child{border-bottom:none}
    .doc-icon{
      width:20px;font-size:15px;color:var(--gray-400);flex-shrink:0;margin-right:12px;
      display:flex;align-items:center;justify-content:center;
    }
    .doc-name{flex:1;font-size:14px;font-weight:500;color:var(--gray-900)}
    .doc-badge{
      font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;
      display:flex;align-items:center;gap:5px;flex-shrink:0;
    }
    .doc-badge.verified{background:var(--green-50);color:var(--green-700)}
    .doc-badge.pending{background:var(--orange-50);color:var(--orange-500)}
    .doc-badge i{font-size:10px}

    /* Notes Input */
    .notes-wrap{margin:18px 20px 0}
    .notes-input{
      width:100%;min-height:72px;padding:14px 16px;
      border:1.5px solid var(--gray-100);border-radius:14px;
      background:var(--white);font-size:14px;font-family:var(--font);
      color:var(--gray-900);resize:vertical;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .notes-input::placeholder{color:var(--gray-400)}
    .notes-input:focus{border-color:var(--green-700);box-shadow:0 0 0 3px rgba(45,106,79,.08)}

    /* Action Buttons */
    .actions{
      display:flex;gap:12px;padding:18px 20px 8px;
    }
    .btn-reject{
      flex:1;padding:15px;border-radius:14px;border:2px solid var(--red-500);
      background:var(--white);color:var(--red-500);font-size:15px;font-weight:600;
      font-family:var(--font);cursor:pointer;transition:transform .12s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-reject:active{transform:scale(.96)}
    .btn-approve{
      flex:1.3;padding:15px;border-radius:14px;border:none;
      background:var(--green-800);color:var(--white);font-size:15px;font-weight:600;
      font-family:var(--font);cursor:pointer;transition:transform .12s;
      display:flex;align-items:center;justify-content:center;gap:8px;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-approve:active{transform:scale(.96)}
    .btn-approve i{font-size:13px}

    /* Bottom Nav */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:393px;background:var(--white);display:flex;justify-content:space-around;align-items:center;padding:6px 0 20px;z-index:100;border-top:1px solid var(--gray-100)}
    .tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 10px 0;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
    .tab i{font-size:19px;color:var(--gray-400);transition:color .2s}
    .tab span{font-size:10px;font-weight:600;color:var(--gray-400);transition:color .2s}
    .tab.on .tab-pill{width:48px;height:32px;border-radius:16px;background:var(--green-800);display:flex;align-items:center;justify-content:center}
    .tab.on .tab-pill i{font-size:16px;color:var(--white)}
    .tab.on span{color:var(--gray-900);font-weight:700}
    .tab:not(.on) .tab-pill{display:flex;align-items:center;justify-content:center;height:32px}

    /* Toast */
    .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--green-800);color:var(--white);font-size:13px;font-weight:600;font-family:var(--font);padding:12px 24px;border-radius:28px;box-shadow:0 8px 28px rgba(27,67,50,.32);z-index:300;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
    .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Animations */
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim{animation:fadeUp .4s ease both}
    .d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}
    .d4{animation-delay:.16s}.d5{animation-delay:.22s}.d6{animation-delay:.28s}

    @media(min-width:500px){body{align-items:center;min-height:100vh;padding:24px}.phone{min-height:852px;max-height:92vh;border-radius:44px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 28px 80px rgba(0,0,0,.12)}.scroll-area{border-radius:0 0 44px 44px}.bottom-nav{border-radius:0 0 44px 44px}}
    @media(max-width:393px){.phone{max-width:100%}.bottom-nav{max-width:100%}}
  </style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-right">
      <i class="fa-solid fa-play" style="font-size:10px"></i>
      <i class="fa-solid fa-circle" style="font-size:10px"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="scroll-area">

    <!-- Header -->
    <div class="header-green anim d1">
      <div class="header-row">
        <div>
          <h1 class="header-title">Verify Merchant</h1>
          <p class="header-crumb">Admin › Merchants › Verify</p>
        </div>
        <div class="avatar-circle" id="btnAvatar">SA</div>
      </div>
    </div>

    <!-- Merchant Info -->
    <div class="merchant-card anim d2">
      <div class="merchant-top">
        <div class="merchant-avatar">QR</div>
        <div class="merchant-details">
          <p class="merchant-name">QuickRoots Farms</p>
          <p class="merchant-cat">Vegetables &amp; Organic</p>
          <p class="merchant-loc"><i class="fa-solid fa-location-dot"></i> Koramangala, Bengaluru</p>
        </div>
      </div>
      <p class="merchant-date">Submitted: Mar 18, 2026 at 2:45 PM</p>
    </div>

    <!-- Document Checklist -->
    <p class="section-title anim d3">Document Checklist</p>

    <div class="doc-list anim d4">
      <div class="doc-row">
        <span class="doc-icon"><i class="fa-solid fa-file-lines"></i></span>
        <span class="doc-name">GST Certificate</span>
        <span class="doc-badge verified"><i class="fa-solid fa-check"></i> Verified</span>
      </div>
      <div class="doc-row">
        <span class="doc-icon"><i class="fa-solid fa-file-lines"></i></span>
        <span class="doc-name">PAN Card</span>
        <span class="doc-badge verified"><i class="fa-solid fa-check"></i> Verified</span>
      </div>
      <div class="doc-row">
        <span class="doc-icon"><i class="fa-solid fa-file-lines"></i></span>
        <span class="doc-name">FSSAI Licence</span>
        <span class="doc-badge pending"><i class="fa-solid fa-triangle-exclamation"></i> Pending</span>
      </div>
      <div class="doc-row">
        <span class="doc-icon"><i class="fa-solid fa-file-lines"></i></span>
        <span class="doc-name">Bank Statement</span>
        <span class="doc-badge verified"><i class="fa-solid fa-check"></i> Verified</span>
      </div>
    </div>

    <!-- Reviewer Notes -->
    <div class="notes-wrap anim d5">
      <textarea class="notes-input" placeholder="Add reviewer notes..."></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="actions anim d6">
      <button class="btn-reject" id="rejectBtn">Reject</button>
      <button class="btn-approve" id="approveBtn"><i class="fa-solid fa-check"></i> Approve Merchant</button>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="tab" data-t="dashboard"><div class="tab-pill"><i class="fa-solid fa-house"></i></div><span>Dashboard</span></button>
    <button class="tab on" data-t="users"><div class="tab-pill"><i class="fa-solid fa-user"></i></div><span>Users</span></button>
    <button class="tab" data-t="orders"><div class="tab-pill"><i class="fa-solid fa-receipt"></i></div><span>Orders</span></button>
    <button class="tab" data-t="finance"><div class="tab-pill"><i class="fa-solid fa-sack-dollar"></i></div><span>Finance</span></button>
    <button class="tab" data-t="more"><div class="tab-pill"><i class="fa-solid fa-grip"></i></div><span>More</span></button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(()=>{
  'use strict';
  const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
  const toast=q('#toast');let tt=null;
  function flash(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),2200)}

  q('#approveBtn').addEventListener('click',()=>flash('Merchant approved ✓'));
  q('#rejectBtn').addEventListener('click',()=>flash('Merchant rejected'));
  q('#btnAvatar').addEventListener('click',()=>flash('Super Admin'));

  qa('.tab').forEach(t=>{t.addEventListener('click',()=>{
    const tab=t.dataset.t;
    if(tab==='dashboard')window.location.href='admin.html';
    else if(tab==='users')window.location.href='users.html';
    else{qa('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');flash(tab.charAt(0).toUpperCase()+tab.slice(1))}
  })});
})();
</script>
</body>
</html>
