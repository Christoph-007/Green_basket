<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Settings — GreenBasket Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<style>
:root{
  --green-900:#14342B;--green-800:#1B4332;--green-700:#2D6A4F;--green-600:#40916C;
  --green-50:#EAF4EC;--orange-500:#E08A3C;--red-500:#D64545;
  --gray-50:#F4F5F4;--gray-100:#E8E9E8;--gray-200:#D4D5D4;--gray-400:#9B9C9B;
  --gray-500:#6F706F;--gray-600:#545654;--gray-700:#3A3B3A;--gray-800:#2A2B2A;--gray-900:#1A1A1A;
  --white:#FFFFFF;--font:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:#F0F0F0;display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased;}
.phone{width:100%;max-width:393px;background:var(--gray-50);min-height:100vh;position:relative;display:flex;flex-direction:column;overflow:hidden;}
@media(min-width:500px){body{align-items:center;padding:24px 0;}.phone{min-height:852px;max-height:852px;border-radius:44px;box-shadow:0 24px 80px rgba(0,0,0,.12);}}

/* Status Bar */
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 24px 0;background:var(--green-800);height:44px;}
.status-bar .time{font-size:15px;font-weight:600;color:var(--white);letter-spacing:-0.3px;}
.status-bar .icons{display:flex;align-items:center;gap:5px;color:var(--white);font-size:14px;}

/* Header */
.header{background:var(--green-800);padding:4px 20px 20px;border-radius:0 0 24px 24px;}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.header h1{font-size:24px;font-weight:800;color:var(--white);letter-spacing:-0.4px;}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green-600);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--white);}
.breadcrumb{font-size:13px;color:rgba(255,255,255,.65);margin-top:2px;}

/* Scroll */
.scroll-area{flex:1;overflow-y:auto;padding:20px 20px 100px;}

/* Section */
.section-title{font-size:16px;font-weight:800;color:var(--gray-900);margin-bottom:12px;letter-spacing:-0.2px;}

/* Card */
.card{background:var(--white);border-radius:14px;border:1.5px solid var(--gray-100);overflow:hidden;margin-bottom:24px;}

/* Row */
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--gray-100);}
.row:last-child{border-bottom:none;}
.row-left{display:flex;align-items:center;gap:10px;}
.row-icon{font-size:18px;width:22px;text-align:center;}
.row-label{font-size:14px;font-weight:500;color:var(--gray-700);}
.row-value{background:var(--gray-50);border:1.5px solid var(--gray-100);border-radius:8px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--gray-800);min-width:52px;text-align:center;}

/* Category override values — green tint */
.row-value.cat{background:var(--green-50);border-color:#C8DECE;color:var(--green-700);}

/* Bottom Nav */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--gray-100);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 0 20px;z-index:50;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;}
.nav-icon{width:48px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gray-400);transition:all .2s;}
.nav-label{font-size:10px;font-weight:600;color:var(--gray-400);transition:color .2s;}
.nav-item.on .nav-icon{background:var(--green-800);color:var(--white);}
.nav-item.on .nav-label{color:var(--green-800);}

/* Animations */
.anim{opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease;}
.anim.visible{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons"><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Settings</h1>
        <div class="breadcrumb">Admin › Commission Settings</div>
      </div>
      <div class="avatar">SA</div>
    </div>
  </div>

  <!-- Scroll Area -->
  <div class="scroll-area">

    <!-- Commission Rates -->
    <div class="section-title anim">Commission Rates</div>
    <div class="card anim">
      <div class="row">
        <span class="row-label">Merchant Commission</span>
        <span class="row-value">18%</span>
      </div>
      <div class="row">
        <span class="row-label">Agent Commission</span>
        <span class="row-value">12%</span>
      </div>
      <div class="row">
        <span class="row-label">Platform Fee</span>
        <span class="row-value">5%</span>
      </div>
      <div class="row">
        <span class="row-label">GST Rate</span>
        <span class="row-value">18%</span>
      </div>
    </div>

    <!-- Category Overrides -->
    <div class="section-title anim">Category Overrides</div>
    <div class="card anim">
      <div class="row">
        <div class="row-left">
          <span class="row-icon">🥬</span>
          <span class="row-label">Vegetables</span>
        </div>
        <span class="row-value cat">16%</span>
      </div>
      <div class="row">
        <div class="row-left">
          <span class="row-icon">🍎</span>
          <span class="row-label">Fruits</span>
        </div>
        <span class="row-value cat">17%</span>
      </div>
      <div class="row">
        <div class="row-left">
          <span class="row-icon">🥛</span>
          <span class="row-label">Dairy</span>
        </div>
        <span class="row-value cat">15%</span>
      </div>
      <div class="row">
        <div class="row-left">
          <span class="row-icon">🧃</span>
          <span class="row-label">Beverages</span>
        </div>
        <span class="row-value cat">18%</span>
      </div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="admin.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-grid-2"></i></span><span class="nav-label">Dashboard</span></a>
    <a href="users.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-users"></i></span><span class="nav-label">Users</span></a>
    <a href="orders.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-bag-shopping"></i></span><span class="nav-label">Orders</span></a>
    <a href="financial-reports.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-coin"></i></span><span class="nav-label">Finance</span></a>
    <a class="nav-item on"><span class="nav-icon"><i class="fa-solid fa-ellipsis"></i></span><span class="nav-label">More</span></a>
  </nav>

</div>

<script>
(function(){
  const els=document.querySelectorAll('.anim');
  els.forEach((el,i)=>setTimeout(()=>el.classList.add('visible'),120+i*100));
})();
</script>
</body>
</html>
