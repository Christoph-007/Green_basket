<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Green Basket – All Merchants</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-700: #2D6A4F;
      --green-800: #1B4332;
      --green-50: #EAF4EC;
      --white: #FFFFFF;
      --gray-50: #F4F5F4;
      --gray-100: #EDEEED;
      --gray-200: #D9DBD9;
      --gray-400: #9CA09C;
      --gray-500: #787C78;
      --gray-900: #1A1A1A;
      --orange-500: #E08A3C;
      --orange-50: #FFF5EB;
      --red-500: #D64545;
      --red-50: #FDECEC;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body { height: 100%; font-family: var(--font); -webkit-font-smoothing: antialiased; }
    body { background: #DDDEDD; display: flex; justify-content: center; align-items: flex-start; }

    /* Phone */
    .phone {
      width: 100%; max-width: 393px; min-height: 100vh;
      background: var(--gray-50); position: relative;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .scroll-area {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; padding-bottom: 84px;
    }
    .scroll-area::-webkit-scrollbar { display: none; }
    .scroll-area { scrollbar-width: none; }

    /* Status Bar */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 26px 0; height: 46px; flex-shrink: 0;
      background: var(--green-800); z-index: 10;
    }
    .status-time { font-size: 15px; font-weight: 600; letter-spacing: .3px; color: var(--white); }
    .status-right { display: flex; align-items: center; gap: 5px; }
    .status-right i { font-size: 12px; color: var(--white); }

    /* Header */
    .header-green {
      background: var(--green-800);
      padding: 14px 20px 28px;
      border-radius: 0 0 24px 24px;
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 22px; font-weight: 700; color: var(--white); letter-spacing: -.3px; }
    .header-crumb { font-size: 13px; font-weight: 400; color: rgba(255,255,255,.5); margin-top: 4px; }
    .avatar-circle {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,.15); display: flex;
      align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: var(--white);
      flex-shrink: 0; border: 2px solid rgba(255,255,255,.25); cursor: pointer;
    }

    /* Search */
    .search-wrap { padding: 20px 20px 14px; }
    .search-box {
      display: flex; align-items: center; gap: 10px;
      background: var(--white); border: 1.5px solid var(--gray-100);
      border-radius: 12px; padding: 13px 16px;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-box:focus-within {
      border-color: var(--green-700);
      box-shadow: 0 0 0 3px rgba(45,106,79,.08);
    }
    .search-box i { font-size: 15px; color: var(--gray-400); flex-shrink: 0; }
    .search-box input {
      flex: 1; border: none; background: transparent;
      font-size: 14px; font-family: var(--font); color: var(--gray-900); outline: none;
    }
    .search-box input::placeholder { color: var(--gray-400); }

    /* Filter Pills */
    .filters { display: flex; gap: 8px; padding: 0 20px 18px; }
    .pill {
      padding: 8px 18px; border-radius: 20px; font-size: 13px;
      font-weight: 600; font-family: var(--font);
      border: 1.5px solid var(--gray-200); background: var(--white);
      color: var(--gray-500); cursor: pointer; transition: all .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .pill:active { transform: scale(.95); }
    .pill.on { background: var(--green-800); color: var(--white); border-color: var(--green-800); }

    /* Merchant List */
    .merchant-list { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }

    .merchant-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--white); border-radius: 14px;
      padding: 16px; cursor: pointer;
      transition: transform .12s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .merchant-row:hover { box-shadow: 0 2px 12px rgba(0,0,0,.05); }
    .merchant-row:active { transform: scale(.985); }

    .merchant-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; flex-shrink: 0;
    }
    .merchant-avatar.olive   { background: #E8EFD5; color: #5F7030; }
    .merchant-avatar.gold    { background: #F5EED5; color: #8A7A30; }
    .merchant-avatar.plum    { background: #EDD5F5; color: #7A308A; }
    .merchant-avatar.sky     { background: #D5E8F5; color: #30708A; }

    .merchant-info { flex: 1; min-width: 0; }
    .merchant-name { font-size: 15px; font-weight: 600; color: var(--gray-900); margin-bottom: 3px; }
    .merchant-meta {
      font-size: 12px; font-weight: 400; color: var(--gray-400);
      display: flex; align-items: center; gap: 4px;
    }
    .merchant-meta .star { color: var(--gray-400); font-size: 11px; }

    .merchant-status { font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .merchant-status.active  { color: var(--green-700); }
    .merchant-status.pending { color: var(--orange-500); }
    .merchant-status.blocked { color: var(--red-500); }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 393px; background: var(--white);
      display: flex; justify-content: space-around; align-items: center;
      padding: 6px 0 20px; z-index: 100; border-top: 1px solid var(--gray-100);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer; padding: 4px 10px 0;
      -webkit-tap-highlight-color: transparent; font-family: var(--font);
    }
    .tab i { font-size: 19px; color: var(--gray-400); transition: color .2s; }
    .tab span { font-size: 10px; font-weight: 600; color: var(--gray-400); transition: color .2s; }
    .tab.on .tab-pill {
      width: 48px; height: 32px; border-radius: 16px;
      background: var(--green-800); display: flex;
      align-items: center; justify-content: center;
    }
    .tab.on .tab-pill i { font-size: 16px; color: var(--white); }
    .tab.on span { color: var(--gray-900); font-weight: 700; }
    .tab:not(.on) .tab-pill { display: flex; align-items: center; justify-content: center; height: 32px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: var(--green-800); color: var(--white);
      font-size: 13px; font-weight: 600; font-family: var(--font);
      padding: 12px 24px; border-radius: 28px;
      box-shadow: 0 8px 28px rgba(27,67,50,.32);
      z-index: 300; opacity: 0; pointer-events: none;
      transition: all .3s cubic-bezier(.34,1.56,.64,1); white-space: nowrap;
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Animations */
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .anim { animation: fadeUp .4s ease both; }
    .d1 { animation-delay: .04s; } .d2 { animation-delay: .08s; }
    .d3 { animation-delay: .12s; } .d4 { animation-delay: .16s; }
    .d5 { animation-delay: .20s; } .d6 { animation-delay: .24s; }
    .d7 { animation-delay: .28s; } .d8 { animation-delay: .32s; }

    /* Responsive */
    @media (min-width:500px) {
      body { align-items:center; min-height:100vh; padding:24px; }
      .phone { min-height:852px; max-height:92vh; border-radius:44px;
        box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 28px 80px rgba(0,0,0,.12); }
      .scroll-area { border-radius: 0 0 44px 44px; }
      .bottom-nav  { border-radius: 0 0 44px 44px; }
    }
    @media (max-width:393px) { .phone { max-width:100%; } .bottom-nav { max-width:100%; } }
  </style>
</head>
<body>

<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-right">
      <i class="fa-solid fa-play" style="font-size:10px;"></i>
      <i class="fa-solid fa-circle" style="font-size:10px;"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="scroll-area">

    <!-- Green Header -->
    <div class="header-green anim d1">
      <div class="header-row">
        <div>
          <h1 class="header-title">All Merchants</h1>
          <p class="header-crumb">Admin › Merchants</p>
        </div>
        <div class="avatar-circle" id="btnAvatar">SA</div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrap anim d2">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search merchants..." id="searchInput" autocomplete="off">
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="filters anim d3" id="filters">
      <button class="pill on" data-filter="all">All</button>
      <button class="pill" data-filter="active">Active</button>
      <button class="pill" data-filter="pending">Pending</button>
      <button class="pill" data-filter="blocked">Blocked</button>
    </div>

    <!-- Merchant List -->
    <div class="merchant-list" id="merchantList">

      <div class="merchant-row anim d4" data-status="active">
        <div class="merchant-avatar olive">FF</div>
        <div class="merchant-info">
          <p class="merchant-name">FreshFarms</p>
          <p class="merchant-meta">Vegetables &amp; Greens · <i class="fa-regular fa-star star"></i> 4.8</p>
        </div>
        <span class="merchant-status active">Active</span>
      </div>

      <div class="merchant-row anim d5" data-status="active">
        <div class="merchant-avatar gold">OO</div>
        <div class="merchant-info">
          <p class="merchant-name">OrganicOasis</p>
          <p class="merchant-meta">Fruits &amp; Dairy · <i class="fa-regular fa-star star"></i> 4.5</p>
        </div>
        <span class="merchant-status active">Active</span>
      </div>

      <div class="merchant-row anim d6" data-status="pending">
        <div class="merchant-avatar plum">HF</div>
        <div class="merchant-info">
          <p class="merchant-name">HarvestHub</p>
          <p class="merchant-meta">Mixed · <i class="fa-regular fa-star star"></i> 4.2</p>
        </div>
        <span class="merchant-status pending">Pending</span>
      </div>

      <div class="merchant-row anim d7" data-status="active">
        <div class="merchant-avatar sky">NB</div>
        <div class="merchant-info">
          <p class="merchant-name">NatureBox</p>
          <p class="merchant-meta">Beverages · <i class="fa-regular fa-star star"></i> 4.6</p>
        </div>
        <span class="merchant-status active">Active</span>
      </div>

    </div>

  </div><!-- /scroll-area -->

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="nav">
    <button class="tab" data-t="dashboard">
      <div class="tab-pill"><i class="fa-solid fa-house"></i></div>
      <span>Dashboard</span>
    </button>
    <button class="tab on" data-t="users">
      <div class="tab-pill"><i class="fa-solid fa-user"></i></div>
      <span>Users</span>
    </button>
    <button class="tab" data-t="orders">
      <div class="tab-pill"><i class="fa-solid fa-receipt"></i></div>
      <span>Orders</span>
    </button>
    <button class="tab" data-t="finance">
      <div class="tab-pill"><i class="fa-solid fa-sack-dollar"></i></div>
      <span>Finance</span>
    </button>
    <button class="tab" data-t="more">
      <div class="tab-pill"><i class="fa-solid fa-grip"></i></div>
      <span>More</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  'use strict';

  const q  = s => document.querySelector(s);
  const qa = s => document.querySelectorAll(s);
  const toast = q('#toast');
  let tt = null;

  function flash(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(() => toast.classList.remove('on'), 2200);
  }

  /* Filter pills */
  const pills = qa('.pill');
  const rows  = qa('.merchant-row');

  pills.forEach(p => {
    p.addEventListener('click', () => {
      pills.forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      const filter = p.dataset.filter;
      rows.forEach(row => {
        const st = row.dataset.status;
        if (filter === 'all' || st === filter) {
          row.style.display = 'flex';
        } else {
          row.style.display = 'none';
        }
      });
    });
  });

  /* Search */
  q('#searchInput').addEventListener('input', e => {
    const val = e.target.value.toLowerCase().trim();
    rows.forEach(row => {
      const name = row.querySelector('.merchant-name').textContent.toLowerCase();
      const meta = row.querySelector('.merchant-meta').textContent.toLowerCase();
      row.style.display = (name.includes(val) || meta.includes(val)) ? 'flex' : 'none';
    });
  });

  /* Bottom nav */
  qa('.tab').forEach(t => {
    t.addEventListener('click', () => {
      const tab = t.dataset.t;
      if (tab === 'dashboard') {
        window.location.href = 'admin.html';
      } else if (tab === 'users') {
        window.location.href = 'users.html';
      } else {
        qa('.tab').forEach(x => x.classList.remove('on'));
        t.classList.add('on');
        flash(tab.charAt(0).toUpperCase() + tab.slice(1));
      }
    });
  });

  /* Avatar */
  q('#btnAvatar').addEventListener('click', () => flash('Super Admin'));
})();
</script>

</body>
</html>
