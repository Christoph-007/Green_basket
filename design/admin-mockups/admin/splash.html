<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Green Basket – Welcome</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       RESET & VARIABLES
       ============================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green-deep: #1B4332;
      --green-mid: #2D6A4F;
      --green-light: #40916C;
      --white: #FFFFFF;
      --white-70: rgba(255,255,255,0.70);
      --white-40: rgba(255,255,255,0.40);
      --white-15: rgba(255,255,255,0.15);
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ============================================
       PHONE SHELL
       ============================================ */
    .phone {
      width: 100%;
      max-width: 393px;
      min-height: 100vh;
      background: var(--green-deep);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ============================================
       STATUS BAR
       ============================================ */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 26px 0;
      height: 46px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .status-time {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--white);
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-right i {
      font-size: 12px;
      color: var(--white);
    }

    /* ============================================
       MAIN CONTENT — flex column
       ============================================ */
    .splash-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ============================================
       LOGO
       ============================================ */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-top: 20px;
      padding-bottom: 16px;
    }

    .logo-icon {
      font-size: 22px;
      color: var(--white);
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.3px;
    }

    /* ============================================
       HEADLINE
       ============================================ */
    .headline {
      text-align: center;
      padding: 0 30px 28px;
    }

    .headline h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-style: italic;
      font-size: 40px;
      line-height: 1.18;
      color: var(--white);
      letter-spacing: -0.5px;
    }

    /* ============================================
       IMAGE CAROUSEL / MOSAIC
       ============================================ */
    .mosaic-section {
      flex: 1;
      position: relative;
      padding: 0 16px;
      min-height: 320px;
      overflow: hidden;
    }

    .mosaic {
      display: flex;
      gap: 10px;
      height: 100%;
      align-items: stretch;
    }

    .mosaic-col {
      flex: 1;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      min-height: 280px;
    }

    .mosaic-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Text overlays on images */
    .mosaic-col .overlay-text {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 14px;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
      color: var(--white);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    /* Left column — taller, shifted down */
    .mosaic-col.col-left {
      flex: 0.7;
      margin-top: 40px;
    }

    /* Center column — tallest, main focal */
    .mosaic-col.col-center {
      flex: 1;
    }

    /* Right column — shorter, shifted down more */
    .mosaic-col.col-right {
      flex: 0.7;
      margin-top: 60px;
    }

    /* Fade at bottom of mosaic to blend into green */
    .mosaic-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to top, var(--green-deep) 0%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* ============================================
       BOTTOM CTA AREA
       ============================================ */
    .cta-area {
      flex-shrink: 0;
      padding: 24px 32px 36px;
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .btn-shop {
      display: block;
      width: 100%;
      padding: 18px 24px;
      background: var(--white);
      color: var(--green-deep);
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      letter-spacing: 0.2px;
    }

    .btn-shop:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .btn-shop:active {
      transform: scale(0.97);
    }

    .legal {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--white-70);
      line-height: 1.5;
    }

    .legal a {
      color: var(--white);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .legal a:hover {
      color: var(--white-70);
    }

    /* ============================================
       TOAST
       ============================================ */
    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: var(--green-mid);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-body);
      padding: 12px 24px;
      border-radius: 28px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================
       ANIMATIONS
       ============================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim-logo {
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .anim-headline {
      animation: fadeUp 0.7s ease 0.25s both;
    }

    .anim-mosaic {
      animation: scaleIn 0.8s ease 0.45s both;
    }

    .anim-cta {
      animation: slideUp 0.6s ease 0.7s both;
    }

    .anim-legal {
      animation: fadeUp 0.5s ease 0.9s both;
    }

    /* ============================================
       RESPONSIVE — desktop frame
       ============================================ */
    @media (min-width: 500px) {
      body {
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .phone {
        min-height: 852px;
        max-height: 92vh;
        border-radius: 44px;
        box-shadow:
          0 0 0 1px rgba(0,0,0,0.08),
          0 28px 80px rgba(0,0,0,0.25);
      }
    }

    @media (max-width: 393px) {
      .phone { max-width: 100%; }
    }

    /* Smaller screens: tighten spacing */
    @media (max-height: 700px) {
      .headline h1 { font-size: 32px; }
      .logo { padding-top: 10px; padding-bottom: 10px; }
      .mosaic-section { min-height: 240px; }
      .cta-area { padding: 18px 28px 26px; }
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <!-- Splash Content -->
  <div class="splash-content">

    <!-- Logo -->
    <div class="logo anim-logo">
      <i class="fa-solid fa-seedling logo-icon"></i>
      <span class="logo-text">Green Basket</span>
    </div>

    <!-- Headline -->
    <div class="headline anim-headline">
      <h1>Shop Smarter,<br>Eat Better</h1>
    </div>

    <!-- Image Mosaic -->
    <div class="mosaic-section anim-mosaic">
      <div class="mosaic">

        <!-- Left column -->
        <div class="mosaic-col col-left">
          <img
            src="https://images.unsplash.com/photo-1488459716781-31db52582fe9?w=300&h=500&fit=crop&auto=format&q=80"
            alt="Fresh produce market stall"
            loading="eager">
          <div class="overlay-text"></div>
        </div>

        <!-- Center column (main) -->
        <div class="mosaic-col col-center">
          <img
            src="https://images.unsplash.com/photo-1533900298318-6b8da08a523e?w=350&h=550&fit=crop&auto=format&q=80"
            alt="Busy market with fresh vegetables"
            loading="eager">
          <div class="overlay-text">Crisp. Farm-Fresh Veggies<br>Made Easy.</div>
        </div>

        <!-- Right column -->
        <div class="mosaic-col col-right">
          <img
            src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=300&h=500&fit=crop&auto=format&q=80"
            alt="Colorful fruits display"
            loading="eager">
          <div class="overlay-text">Crave<br>Anyth…</div>
        </div>

      </div>
      <div class="mosaic-fade"></div>
    </div>

    <!-- CTA -->
    <div class="cta-area">
      <button class="btn-shop anim-cta" id="btnShop">Shop Now</button>
      <p class="legal anim-legal">
        By clicking, you agree to our <a href="javascript:void(0)" id="lnkTerms">Terms and Conditions</a> and <a href="javascript:void(0)" id="lnkPrivacy">Privacy Policy</a>
      </p>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>


<script>
(() => {
  'use strict';

  const q = s => document.querySelector(s);
  const toast = q('#toast');
  let tt = null;

  function flash(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(() => toast.classList.remove('on'), 2200);
  }

  /* Shop Now → navigate to main app */
  q('#btnShop').addEventListener('click', () => {
    flash('Loading your store…');
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 800);
  });

  /* Legal links */
  q('#lnkTerms').addEventListener('click', e => {
    e.preventDefault();
    flash('Terms and Conditions');
  });

  q('#lnkPrivacy').addEventListener('click', e => {
    e.preventDefault();
    flash('Privacy Policy');
  });

})();
</script>

</body>
</html>
