<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Green Basket – Send Notification</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --green-700:#2D6A4F;--green-800:#1B4332;--green-50:#EAF4EC;
      --white:#FFFFFF;--gray-50:#F4F5F4;--gray-100:#EDEEED;--gray-200:#D9DBD9;
      --gray-400:#9CA09C;--gray-500:#787C78;--gray-900:#1A1A1A;
      --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased}
    body{background:#DDDEDD;display:flex;justify-content:center;align-items:flex-start}

    .phone{width:100%;max-width:393px;min-height:100vh;background:var(--gray-50);position:relative;display:flex;flex-direction:column;overflow:hidden}
    .scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:84px}
    .scroll-area::-webkit-scrollbar{display:none}.scroll-area{scrollbar-width:none}

    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 0;height:46px;flex-shrink:0;background:var(--green-800);z-index:10}
    .status-time{font-size:15px;font-weight:600;letter-spacing:.3px;color:var(--white)}
    .status-right{display:flex;align-items:center;gap:5px}
    .status-right i{font-size:12px;color:var(--white)}

    .header-green{background:var(--green-800);padding:14px 20px 28px;border-radius:0 0 24px 24px}
    .header-row{display:flex;align-items:center;justify-content:space-between}
    .header-title{font-size:22px;font-weight:700;color:var(--white);letter-spacing:-.3px}
    .header-sub{font-size:13px;font-weight:400;color:rgba(255,255,255,.5);margin-top:4px}
    .avatar-circle{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--white);flex-shrink:0;border:2px solid rgba(255,255,255,.25);cursor:pointer}

    /* Stat Cards */
    .stat-row{display:flex;gap:10px;padding:20px 20px 0}
    .stat-card{
      flex:1;border-radius:14px;padding:16px;
    }
    .stat-card.green-card{background:var(--green-50)}
    .stat-card.amber-card{background:#FFF9E6}
    .stat-percent{font-size:24px;font-weight:800;margin-bottom:2px}
    .stat-card.green-card .stat-percent{color:var(--green-700)}
    .stat-card.amber-card .stat-percent{color:var(--green-700)}
    .stat-label{font-size:12px;font-weight:500;color:var(--gray-500)}

    /* Compose Card */
    .compose-card{
      margin:18px 20px 0;background:var(--white);border-radius:16px;padding:20px 18px;
    }
    .compose-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:16px}

    .input-field{
      width:100%;padding:13px 16px;border:1.5px solid var(--gray-100);
      border-radius:12px;background:var(--white);font-size:14px;
      font-family:var(--font);color:var(--gray-900);outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .input-field::placeholder{color:var(--gray-400)}
    .input-field:focus{border-color:var(--green-700);box-shadow:0 0 0 3px rgba(45,106,79,.08)}

    .field-label{font-size:13px;font-weight:600;color:var(--gray-900);margin:16px 0 10px}

    /* Audience Pills */
    .audience-pills{display:flex;gap:8px;margin-bottom:16px}
    .a-pill{
      padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;
      font-family:var(--font);border:1.5px solid var(--gray-200);
      background:var(--white);color:var(--gray-500);cursor:pointer;
      transition:all .2s;-webkit-tap-highlight-color:transparent;
    }
    .a-pill:active{transform:scale(.95)}
    .a-pill.on{background:var(--green-800);color:var(--white);border-color:var(--green-800)}

    /* Textarea */
    .msg-area{
      width:100%;min-height:100px;padding:14px 16px;
      border:1.5px solid var(--gray-100);border-radius:12px;
      background:var(--white);font-size:14px;font-family:var(--font);
      color:var(--gray-900);resize:vertical;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .msg-area::placeholder{color:var(--gray-400)}
    .msg-area:focus{border-color:var(--green-700);box-shadow:0 0 0 3px rgba(45,106,79,.08)}

    /* Action Buttons */
    .actions{display:flex;gap:12px;padding:18px 20px 8px}
    .btn-test{
      flex:1;padding:15px;border-radius:14px;border:2px solid var(--green-800);
      background:var(--white);color:var(--green-800);font-size:15px;font-weight:600;
      font-family:var(--font);cursor:pointer;transition:transform .12s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-test:active{transform:scale(.96)}
    .btn-send{
      flex:1.3;padding:15px;border-radius:14px;border:none;
      background:var(--green-800);color:var(--white);font-size:15px;font-weight:600;
      font-family:var(--font);cursor:pointer;transition:transform .12s;
      display:flex;align-items:center;justify-content:center;gap:8px;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-send:active{transform:scale(.96)}
    .btn-send i{font-size:14px}

    /* Bottom Nav */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:393px;background:var(--white);display:flex;justify-content:space-around;align-items:center;padding:6px 0 20px;z-index:100;border-top:1px solid var(--gray-100)}
    .tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 10px 0;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
    .tab i{font-size:19px;color:var(--gray-400);transition:color .2s}
    .tab span{font-size:10px;font-weight:600;color:var(--gray-400);transition:color .2s}
    .tab.on .tab-pill{width:48px;height:32px;border-radius:16px;background:var(--green-800);display:flex;align-items:center;justify-content:center}
    .tab.on .tab-pill i{font-size:16px;color:var(--white)}
    .tab.on span{color:var(--gray-900);font-weight:700}
    .tab:not(.on) .tab-pill{display:flex;align-items:center;justify-content:center;height:32px}

    .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--green-800);color:var(--white);font-size:13px;font-weight:600;font-family:var(--font);padding:12px 24px;border-radius:28px;box-shadow:0 8px 28px rgba(27,67,50,.32);z-index:300;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
    .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim{animation:fadeUp .4s ease both}
    .d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.14s}
    .d4{animation-delay:.20s}

    @media(min-width:500px){body{align-items:center;min-height:100vh;padding:24px}.phone{min-height:852px;max-height:92vh;border-radius:44px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 28px 80px rgba(0,0,0,.12)}.scroll-area{border-radius:0 0 44px 44px}.bottom-nav{border-radius:0 0 44px 44px}}
    @media(max-width:393px){.phone{max-width:100%}.bottom-nav{max-width:100%}}
  </style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-right">
      <i class="fa-solid fa-play" style="font-size:10px"></i>
      <i class="fa-solid fa-circle" style="font-size:10px"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="scroll-area">

    <div class="header-green anim d1">
      <div class="header-row">
        <div>
          <h1 class="header-title">Send Notification</h1>
          <p class="header-sub">12,847 sent today</p>
        </div>
        <div class="avatar-circle" id="btnAvatar">SA</div>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="stat-row anim d2">
      <div class="stat-card green-card">
        <p class="stat-percent">24.3%</p>
        <p class="stat-label">Open Rate</p>
      </div>
      <div class="stat-card amber-card">
        <p class="stat-percent">8.7%</p>
        <p class="stat-label">Click Rate</p>
      </div>
    </div>

    <!-- Compose Card -->
    <div class="compose-card anim d3">
      <p class="compose-title">Compose Notification</p>

      <input type="text" class="input-field" placeholder="Notification title..." id="titleInput" autocomplete="off">

      <p class="field-label">Target Audience</p>
      <div class="audience-pills" id="audiencePills">
        <button class="a-pill on" data-audience="all">All Users</button>
        <button class="a-pill" data-audience="active">Active</button>
        <button class="a-pill" data-audience="premium">Premium</button>
      </div>

      <textarea class="msg-area" placeholder="Write your message here..." id="msgArea"></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="actions anim d4">
      <button class="btn-test" id="testBtn">Send Test</button>
      <button class="btn-send" id="sendBtn">Send to All <i class="fa-solid fa-paper-plane"></i></button>
    </div>

  </div>

  <nav class="bottom-nav">
    <button class="tab" data-t="dashboard"><div class="tab-pill"><i class="fa-solid fa-house"></i></div><span>Dashboard</span></button>
    <button class="tab" data-t="users"><div class="tab-pill"><i class="fa-solid fa-user"></i></div><span>Users</span></button>
    <button class="tab" data-t="orders"><div class="tab-pill"><i class="fa-solid fa-receipt"></i></div><span>Orders</span></button>
    <button class="tab" data-t="finance"><div class="tab-pill"><i class="fa-solid fa-sack-dollar"></i></div><span>Finance</span></button>
    <button class="tab on" data-t="more"><div class="tab-pill"><i class="fa-solid fa-grip"></i></div><span>More</span></button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(()=>{
  'use strict';
  const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
  const toast=q('#toast');let tt=null;
  function flash(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),2200)}

  /* Audience pills */
  qa('.a-pill').forEach(p=>{
    p.addEventListener('click',()=>{
      qa('.a-pill').forEach(x=>x.classList.remove('on'));
      p.classList.add('on');
      /* Update send button text */
      const audience=p.dataset.audience;
      const label=audience==='all'?'All':audience.charAt(0).toUpperCase()+audience.slice(1);
      q('#sendBtn').innerHTML='Send to '+label+' <i class="fa-solid fa-paper-plane"></i>';
    });
  });

  /* Send buttons */
  q('#testBtn').addEventListener('click',()=>{
    const title=q('#titleInput').value.trim();
    if(!title){flash('Please add a title');return}
    flash('Test notification sent ✓');
  });

  q('#sendBtn').addEventListener('click',()=>{
    const title=q('#titleInput').value.trim();
    const msg=q('#msgArea').value.trim();
    if(!title){flash('Please add a title');return}
    if(!msg){flash('Please write a message');return}
    const audience=q('.a-pill.on').textContent;
    flash('Sent to '+audience+' ✓');
  });

  /* Bottom nav */
  qa('.tab').forEach(t=>{t.addEventListener('click',()=>{
    const tab=t.dataset.t;
    if(tab==='dashboard')window.location.href='admin.html';
    else if(tab==='users')window.location.href='users.html';
    else if(tab==='orders')window.location.href='orders.html';
    else{qa('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');flash(tab.charAt(0).toUpperCase()+tab.slice(1))}
  })});

  q('#btnAvatar').addEventListener('click',()=>flash('Super Admin'));
})();
</script>
</body>
</html>
