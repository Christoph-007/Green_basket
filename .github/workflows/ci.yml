name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Errors fail the build. Warnings and infos are reported but do not fail it yet;
      # remove the two --no-fatal flags once the existing warnings are cleaned up.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  backend:
    name: Backend tests and API contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # mongodb-memory-server downloads a MongoDB binary on first use.
      - run: npm run test:run
      - run: npm run check:api
